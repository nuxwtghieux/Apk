name: Build APK from ZIP
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip source code
        run: |
          # Đã sửa thành TH.zip theo tên file của bạn
          unzip -o TH.zip
          echo "--- DANH SÁCH FILE SAU KHI GIẢI NÉN ---"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          # Tự động tìm file gradlew
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Lỗi: Không tìm thấy file gradlew trong thư mục giải nén!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Tìm thấy dự án tại: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: SnowPanel-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
